name: Daily NEL scan

on:
  schedule:
    # One of these two UTC times is 4:10 PM in New York; the runner ignores
    # the other one and handles daylight-saving time itself.
    - cron: "10 20,21 * * 1-5"
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Optional YYYY-MM-DD output stamp (default: next NYSE session)"
        required: false
        type: string
      force:
        description: "Run even outside the post-close window"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-nel-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run after the US market close
        id: scan
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
          SNAPSHOT_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshot_date || '' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${FORCE_RUN}" == "1" ]]; then
            ARGS+=(--force)
          fi
          if [[ -n "${SNAPSHOT_DATE}" ]]; then
            ARGS+=(--snapshot-date "${SNAPSHOT_DATE}")
          fi
          python scripts/run_after_close.py "${ARGS[@]}"
          # Detect whether this invocation actually produced/updated outputs.
          if git status --porcelain outputs industry_flow_dashboard.html index.html theme_tracker.html | grep -q .; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            if [[ "${FORCE_RUN}" == "1" ]]; then
              echo "Forced run produced no file changes — failing."
              exit 1
            fi
            echo "No file changes (likely the off-DST cron or already ran today)."
          fi

      - name: Commit the refreshed dashboard and daily outputs
        if: steps.scan.outputs.ran == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs industry_flow_dashboard.html index.html theme_tracker.html
          git diff --cached --quiet && exit 0
          git commit -m "Update NEL scan for $(date -u +%F)"
          git push
